openapi: 3.1.0
info:
  title: PetGuardian API
  version: 0.1.0
paths:
  /api/auth/login:
    post:
      summary: Login with JWT
  /api/auth/me:
    get:
      summary: Return the current authenticated user
      security:
        - bearerAuth: []
  /api/auth/refresh:
    post:
      summary: Refresh JWT within refresh window
  /api/auth/logout:
    post:
      summary: Invalidate the current token
      security:
        - bearerAuth: []
  /api/runtime:
    get:
      summary: Expose runtime flags
  /api/pets:
    get:
      summary: List public pets
    post:
      summary: Create a pet
      security:
        - bearerAuth: []
  /api/pets/{slug}:
    get:
      summary: Show pet profile
    put:
      summary: Update pet
      security:
        - bearerAuth: []
    delete:
      summary: Delete pet unless memorial
      security:
        - bearerAuth: []
  /api/pets/{slug}/timeline:
    get:
      summary: List timeline posts for a pet
    post:
      summary: Create a timeline post for a pet
      security:
        - bearerAuth: []
  /api/pets/{slug}/needs:
    get:
      summary: List active needs for a pet
    post:
      summary: Create a need for a pet
      security:
        - bearerAuth: []
  /api/pets/{slug}/transparency:
    get:
      summary: List transparency records for a pet
  /api/pets/{slug}/follow:
    post:
      summary: Follow a pet
      security:
        - bearerAuth: []
    delete:
      summary: Unfollow a pet
      security:
        - bearerAuth: []
  /api/organizations:
    get:
      summary: List organizations
  /api/organizations/{slug}:
    get:
      summary: Show organization profile
  /api/transparency:
    get:
      summary: List transparency records
  /api/donations:
    post:
      summary: Create a donation
      security:
        - bearerAuth: []
  /api/donations/simulate:
    post:
      summary: Simulate a paid donation in local/dev
      security:
        - bearerAuth: []
  /api/donations/my:
    get:
      summary: List current user donations
      security:
        - bearerAuth: []
  /api/sponsorships:
    post:
      summary: Create a legacy local sponsorship
      security:
        - bearerAuth: []
  /api/sponsorships/checkout:
    post:
      summary: Create a recurring support checkout session
      security:
        - bearerAuth: []
  /api/sponsorships/my:
    get:
      summary: List current user sponsorships
      security:
        - bearerAuth: []
  /api/sponsorships/{sponsorship}/pause:
    patch:
      summary: Pause a sponsorship
      security:
        - bearerAuth: []
  /api/sponsorships/{sponsorship}/resume:
    patch:
      summary: Resume a sponsorship
      security:
        - bearerAuth: []
  /api/sponsorships/{sponsorship}/cancel:
    patch:
      summary: Cancel a sponsorship
      security:
        - bearerAuth: []
  /api/reports:
    post:
      summary: Create a report
      security:
        - bearerAuth: []
  /api/reports/my:
    get:
      summary: List reports created by the current user
      security:
        - bearerAuth: []
  /api/webhooks/stripe:
    post:
      summary: Handle Stripe payment webhooks
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
